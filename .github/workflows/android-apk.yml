name: Build Android APKs (Debug & Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is@19 --legacy-peer-deps
          npm install @capacitor-firebase/authentication --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Ensure Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add google-services.json (from repo file or secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "Using google-services.json from repo"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "Using google-services.json from secret"
          else
            echo "No google-services.json found"
          fi

      - name: Force fixed debug keystore in Gradle
        run: |
          ls -la android-debug/
          mkdir -p ~/.android
          cp android-debug/debug.keystore ~/.android/debug.keystore
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'
          s = open(p).read()
          ks = os.path.join(os.environ['GITHUB_WORKSPACE'], 'android-debug', 'debug.keystore')
          if not os.path.exists(ks):
              raise SystemExit('debug.keystore not found: ' + ks)
          block = (
              "\n    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('" + ks + "')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "    }\n"
          )
          if 'android-debug/debug.keystore' not in s:
              s, n = re.subn(r'^android\s*\{', lambda m: m.group(0) + block, s, count=1, flags=re.M)
              if n == 0:
                  raise SystemExit('android block not found in build.gradle')
              open(p, 'w').write(s)
          print('Patched build.gradle with fixed debug keystore')
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signing SHA-1 (check)
        continue-on-error: true
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "=== APK SIGNING CERT ==="
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" || true
          echo "=== google-services.json ==="
          grep -E "package_name|certificate_hash" android/app/google-services.json || true

      - name: Build Release APK
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-pro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-pro-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
