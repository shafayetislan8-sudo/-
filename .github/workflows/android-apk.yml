name: Build Android APKs (Debug & Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is@19 --legacy-peer-deps
          npm install @capacitor-firebase/authentication --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Ensure Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add google-services.json (from repo file or secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "Using google-services.json from repo"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "Using google-services.json from secret"
          else
            echo "No google-services.json found"
          fi

      - name: Use fixed debug keystore (keeps SHA-1 same every build)
        run: |
          if [ -f android-debug/debug.keystore ]; then
            mkdir -p ~/.android
            cp android-debug/debug.keystore ~/.android/debug.keystore
            echo "Fixed debug keystore installed"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-pro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mess-manager-pro-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
